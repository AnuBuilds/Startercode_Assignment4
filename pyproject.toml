
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-booking-system"
version = "1.0.0"
description = "Movie Ticket Booking System for CSCN73010 Assignment 4"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Anagha Mampuzha"}
]
dependencies = []

[project.optional-dependencies]
dev = ["build", "pytest"]

[project.scripts]
movie-booking = "movie_booking.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
